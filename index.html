<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://kryogames.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="KryoGames" />
    <meta name="apple-mobile-web-app-title" content="KryoGames" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#121212" />
    <meta
      name="description"
      content="KryoGames — indie web games you can play in the browser. More titles coming soon."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KryoGames" />
    <meta property="og:title" content="KryoGames — Indie web games" />
    <meta
      property="og:description"
      content="Indie web games you can play in the browser. More titles coming soon."
    />
    <meta property="og:url" content="https://kryogames.com/" />
    <meta property="og:image" content="https://kryogames.com/og.png" />
    <meta property="og:image:alt" content="KryoGames" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KryoGames — Indie web games" />
    <meta
      name="twitter:description"
      content="Indie web games you can play in the browser. More titles coming soon."
    />
    <meta name="twitter:image" content="https://kryogames.com/og.png" />
    <title>KryoGames — Indie web games</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "KryoGames",
            "alternateName": ["Kryo Games"],
            "url": "https://kryogames.com/"
          },
          {
            "@type": "Organization",
            "name": "KryoGames",
            "url": "https://kryogames.com/",
            "logo": "https://kryogames.com/og.png"
          }
        ]
      }
    </script>
    <script>
      try {
        var t = localStorage.getItem('kryogames-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
